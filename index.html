<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Помиримся с Алиной? 🥺</title>
<style>
body {
background: linear-gradient(135deg, #ffe6e6 0%, #ffb6c1 100%);
font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
margin: 0;
padding: 0;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
text-align: center;
}

.container {
background-color: rgba(255, 255, 255, 0.95);
padding: 40px;
border-radius: 30px;
box-shadow: 0 15px 35px rgba(255, 105, 180, 0.4);
border: 3px solid #ff69b4;
width: 600px;
position: relative;
}

h1 {
color: #d63384;
font-size: 2.2em;
margin-bottom: 20px;
text-shadow: 2px 2px 4px rgba(214, 51, 132, 0.2);
}

p {
color: #6c757d;
font-size: 1.2em;
margin-bottom: 30px;
}

.btn-container {
display: flex;
justify-content: center;
gap: 20px;
margin-top: 20px;
transition: 0.3s;
}

button {
font-family: inherit;
font-size: 1.3em;
padding: 15px 40px;
border: none;
border-radius: 50px;
cursor: pointer;
transition: 0.3s;
font-weight: bold;
box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

#yesBtn {
background-color: #ff69b4;
color: white;
}

#yesBtn:hover {
background-color: #d63384;
transform: scale(1.1);
}

#noBtn {
background-color: #e0e0e0;
color: #6c757d;
position: relative;
}

/* --- ЭКРАН ПОСЛЕ ПРИМИРЕНИЯ --- */
.success-screen {
display: none;
}

.success-screen h1 {
color: #e83e8c;
font-size: 2.2em;
}

.love-message {
font-size: 2.2em;
font-weight: bold;
color: #ff1493;
margin-top: 20px;
margin-bottom: 20px;
text-shadow: 0 0 15px rgba(255, 20, 147, 0.5);
opacity: 0;
animation: fadeIn 2s forwards;
animation-delay: 1s;
}

@keyframes fadeIn {
from { opacity: 0; transform: scale(0.5); }
to { opacity: 1; transform: scale(1); }
}

/* --- СТИЛИ ДЛЯ ОДНОЙ ФОТОГРАФИИ --- */
.single-photo {
margin-top: 15px;
}

.single-photo img {
width: 250px; /* Ширина фото */
height: 250px; /* Высота фото (чтобы было квадратным) */
object-fit: cover; /* Чтобы фото не искажалось, а обрезалось по краям */
border-radius: 20px; /* Закругленные углы */
border: 5px solid #ffb6c1; /* Нежно-розовая рамка */
box-shadow: 0 10px 20px rgba(255, 105, 180, 0.3); /* Розовая тень */
transition: 0.3s;
}

.single-photo img:hover {
transform: scale(1.05) rotate(2deg); /* Немного увеличивается при наведении */
}

/* Плавающие сердечки на фоне */
.heart {
position: absolute;
color: #ff69b4;
font-size: 24px;
animation: float 4s infinite ease-in-out;
opacity: 0.6;
}

@keyframes float {
0% { transform: translateY(0) scale(1); }
50% { transform: translateY(-20px) scale(1.2); }
100% { transform: translateY(0) scale(1); }
}
</style>
</head>
<body>

<!-- Символы сердечек на фоне -->
<div class="heart" style="top: 10%; left: 10%;">💖</div>
<div class="heart" style="top: 20%; right: 15%; animation-delay: 1s;">💕</div>
<div class="heart" style="bottom: 15%; left: 20%; animation-delay: 2s;">💗</div>
<div class="heart" style="bottom: 10%; right: 10%; animation-delay: 0.5s;">💖</div>

<!-- ОСНОВНОЕ ОКНО (Вопрос) -->
<div class="container" id="mainBox">
<h1>Помиримся с Алиной? 🥺</h1>

<p>Я очень скучаю и надеюсь, что ты нажмешь "Да"</p>

<div class="btn-container" id="buttons">
<button id="yesBtn" onclick="showSuccess()">Да 💖</button>
<button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">Нет</button>
</div>
</div>

<!-- ОКНО УСПЕХА -->
<div class="container success-screen" id="successBox">
<h1>Урааа! Я знала! 💕</h1>

<div class="love-message">Люблю тебя, Сереженька 💖</div>

<!-- ВСТАВКА ОДНОЙ ФОТОГРАФИИ -->
<div class="single-photo">
<img src="our_photo.jpg" alt="Наше фото">
</div>

<p style="margin-top: 20px; font-size: 1em; color: #ff69b4;">Твоя Алина ❤️</p>
</div>

<script>
function showSuccess() {
document.getElementById('mainBox').style.display = 'none';
document.getElementById('successBox').style.display = 'block';
}

function moveNoButton() {
const noBtn = document.getElementById('noBtn');

let currentSize = parseFloat(window.getComputedStyle(noBtn).fontSize);
noBtn.style.fontSize = (currentSize * 0.8) + "px";

const yesBtn = document.getElementById('yesBtn');
let yesSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
yesBtn.style.fontSize = (yesSize * 1.2) + "px";

const randomX = Math.floor(Math.random() * 100) - 50;
const randomY = Math.floor(Math.random() * 100) - 50;

if (currentSize < 8) {
noBtn.style.display = 'none';
} else {
noBtn.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomX}deg)`;
}
}
</script>

</body>
</html>
